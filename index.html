}
[data-theme="dark"]{
  --ink:#ececf2;--paper:#16161f;--warm-mid:#2a2a38;

html{font-size:16px;}
body{background:var(--paper);color:var(--ink);font-family:'Noto Sans Thai','Inter',sans-serif;min-height:100vh;padding-bottom:3rem;transition:background .3s,color .3s;}
.num{font-family:'Fraunces',serif;}

#info-bar{display:flex;align-items:center;gap:.5rem;padding:.4rem 2rem;font-family:'DM Mono',monospace;font-size:.7rem;background:var(--header-bg);color:#9a9585;}
#info-dot{width:7px;height:7px;border-radius:50%;background:#3a7d5a;flex-shrink:0;}

header{background:var(--header-bg);color:var(--header-fg);padding:1.5rem 2rem;display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;}
#theme-toggle{align-self:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:var(--header-fg);font-size:1rem;width:38px;height:38px;border-radius:50%;cursor:pointer;transition:background .15s,transform .1s;display:flex;align-items:center;justify-content:center;}

header h1{font-family:'Fraunces',serif;font-weight:300;font-size:2rem;letter-spacing:-.02em;flex:1;}

.month-nav{display:flex;align-items:center;gap:1rem;padding:1rem 2rem;max-width:980px;margin:0 auto;}
.month-nav button{background:none;border:1.5px solid var(--border);color:var(--ink);font-family:'Noto Sans Thai',sans-serif;font-size:.78rem;padding:.4rem .8rem;border-radius:20px;cursor:pointer;white-space:nowrap;transition:border-color .15s,color .15s;}

.month-nav span{font-family:'Fraunces',serif;font-size:1.4rem;font-weight:300;flex:1;text-align:center;}

.tabs{display:flex;border-bottom:2px solid var(--border);background:var(--paper);position:sticky;top:0;z-index:10;overflow-x:auto;}
.tab-btn{font-family:'Noto Sans Thai',sans-serif;font-size:.82rem;font-weight:500;padding:.85rem 1.4rem;border:none;background:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .15s,border-color .15s;}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}

.panel{display:none;padding:2rem;max-width:980px;margin:0 auto;}
.panel.active{display:block;}
.section-label{font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem;}

/* ── summary cards ── */
.summary-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1.5rem;}
.sum-card{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:1.2rem 1.4rem;border-left-width:4px;}
.sum-card .label{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.06em;color:var(--muted);margin-bottom:.5rem;}
.sum-card .value{font-family:'Fraunces',serif;font-size:1.8rem;font-weight:600;}
.sum-card.total{border-left-color:var(--blue);}.sum-card.total .value{color:var(--blue);}
.sum-card.done{border-left-color:var(--green);}.sum-card.done .value{color:var(--green);}
.sum-card.upcoming{border-left-color:var(--gold);}.sum-card.upcoming .value{color:var(--gold);}
.sum-card.cancel{border-left-color:var(--accent);}.sum-card.cancel .value{color:var(--accent);}

/* ── chart card ── */
.chart-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:1.4rem 1.5rem;margin-bottom:1.5rem;}
.balance-track{height:14px;background:var(--warm-mid);border-radius:10px;overflow:hidden;display:flex;margin:.75rem 0 .75rem;}
.balance-track > div{height:100%;transition:width .5s;}
.balance-legend{display:flex;gap:1.25rem;flex-wrap:wrap;font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);}
.balance-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle;}

/* ── org bars ── */
.cat-bar-row{display:flex;align-items:center;gap:.75rem;margin-bottom:.8rem;cursor:pointer;}
.cat-bar-swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.cat-bar-label{font-size:.82rem;min-width:120px;flex-shrink:0;}
.cat-bar-track{flex:1;height:9px;background:var(--warm-mid);border-radius:10px;overflow:hidden;}
.cat-bar-fill{height:100%;border-radius:10px;transition:width .5s ease;}
.cat-bar-amt{font-family:'Fraunces',serif;font-size:.85rem;width:70px;text-align:right;color:var(--muted);}

/* ── list items ── */
.fin-list{display:flex;flex-direction:column;gap:.5rem;}
.fin-item{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;background:var(--surface);border-radius:8px;border:1.5px solid var(--border);border-left-width:4px;cursor:pointer;transition:transform .1s;}

.fin-item .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.fin-item .nm{flex:1;font-size:.86rem;min-width:0;}
.fin-item .nm .org-row{display:flex;align-items:center;gap:.35rem;margin-top:.2rem;}
.fin-item .nm .org-chip{display:inline-flex;align-items:center;gap:.28rem;font-family:'DM Mono',monospace;font-size:.62rem;padding:.1rem .45rem;border-radius:10px;font-weight:500;}
.fin-item .nm .org-chip .chip-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.fin-item .dt{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);white-space:nowrap;}
.fin-item .badge{font-size:.64rem;padding:.18rem .55rem;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.badge.done{background:var(--green-soft);color:var(--green);}
.badge.upcoming{background:var(--gold-soft);color:var(--gold);}
.badge.cancel{background:var(--accent-soft);color:var(--accent);}

/* ── day groups ── */
.day-group{margin-bottom:1.25rem;}
.day-group-header{display:flex;justify-content:space-between;align-items:center;padding:.3rem .2rem .5rem;border-bottom:1.5px solid var(--border);margin-bottom:.5rem;}
.day-group-date{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--ink);font-weight:500;}
.day-group-sum{font-family:'Fraunces',serif;font-size:.85rem;font-weight:600;color:var(--muted);}

/* ── filter row ── */
.filter-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.25rem;align-items:center;}

.pill{font-family:'Noto Sans Thai',sans-serif;font-size:.74rem;font-weight:500;padding:.4rem .9rem;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .15s;}

.modal-actions{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.25rem;}

function buildOrgColorMap(){
  const counts={};
  MEETINGS.forEach(m=>{const o=orgLabel(m);counts[o]=(counts[o]||0)+1;});
  const sorted=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  const map={};
  sorted.forEach((o,i)=>{ map[o]={...ORG_PALETTE[i%ORG_PALETTE.length], name:o}; });
  return map;
}

function statusOf(m){
  if(m.cancelled) return "cancel";
  if(m.done) return "done";
  return "upcoming";
}
function statusLabel(s){
  return s==="done"?"เสร็จสิ้น":s==="cancel"?"ยกเลิก":"กำลังจะถึง";
}
function statusColorVar(s){
  return s==="done"?"var(--green)":s==="cancel"?"var(--accent)":"var(--gold)";
}

function byMonth(key){ return MEETINGS.filter(m=>m.month===key); }

function groupByDay(list){
  const groups={};
  const order=[];
  list.forEach(m=>{
    const key=m.date||m.dateLabel||"ไม่ระบุวันที่";
    if(!groups[key]){groups[key]=[];order.push(key);}
    groups[key].push(m);
  });
  return order.map(k=>({key:k,label:groups[k][0].dateLabel||k,items:groups[k]}));
}

function escHtml(s){
  if(!s) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function linkify(text){
  if(!text) return "";
  return escHtml(text).replace(/(https?:\/\/[^\s|&]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

function meetingIndex(m){ return MEETINGS.indexOf(m); }

function orgChipHTML(m){
  const o=orgLabel(m);
  const c=ORG_COLOR[o]||ORG_PALETTE[13];
  return `<span class="org-chip" style="background:${c.bg};color:${c.fg}"><span class="chip-dot" style="background:${c.dot}"></span>${escHtml(o)}</span>`;
}

function finItemHTML(m,editable){
  const s=statusOf(m);
  const idx=meetingIndex(m);
  return `<div class="fin-item" style="border-left-color:${statusColorVar(s)}" onclick="openMeeting(${idx})">
    <span class="status-dot" style="background:${statusColorVar(s)}"></span>
    <span class="nm">${escHtml(m.subject)}<span class="org-row">${orgChipHTML(m)}</span></span>
    <span class="dt">${m.time?escHtml(m.time):""}</span>

    ${editable?`<button class="edit-btn" onclick="event.stopPropagation();openEditMeeting(${idx})" title="แก้ไข">&#9998;</button>`:''}
  </div>`;
}

function dayGroupHTML(list,editable){
  if(!list.length) return `<div class="empty"><span>&#128197;</span>ไม่มีรายการ</div>`;
  const groups=groupByDay(list);
  return `<div class="fin-list">` + groups.map(g=>`

      </div>

    </div>`).join("") + `</div>`;
}

window.saveNewMeeting=function(){
  const subject=(document.getElementById("add-subject").value||"").trim();
  if(!subject){document.getElementById("add-subject").focus();return;}
  const dateVal=document.getElementById("add-date").value;
  const timeVal=(document.getElementById("add-time").value||"").trim();
  const org=(document.getElementById("add-org").value||"").trim()||null;
  const statusVal=document.getElementById("add-status").value;
  const attendees=(document.getElementById("add-attendees").value||"").trim()||null;
  const notes=(document.getElementById("add-notes").value||"").trim()||null;
  const docno=(document.getElementById("add-docno").value||"").trim()||null;

  let iso=null, dateLabel=null, month=null;
  if(dateVal){
    iso=dateVal;
    const [y,mo,d]=dateVal.split("-").map(Number);
    const ABBR=["","ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
    const be=y+543;
    dateLabel=`${d} ${ABBR[mo]} ${String(be).slice(2)}`;
    month=`${y}-${String(mo).padStart(2,"0")}`;
  }

  const newEntry={
    date:iso, dateLabel, month,
    time:timeVal||null,
    done:statusVal==="done",
    cancelled:statusVal==="cancel",
    subject, org, docno, docdate:null, attendees, notes
  };

  if(month) viewMonth=month;
  _pendingSuccess=true;
  clearAddForm();
  db.collection("meetings").add(newEntry).catch(e=>{_pendingSuccess=false;alert("บันทึกไม่สำเร็จ: "+e.message);});
};

          <div class="annual-bars">
            <div class="annual-bar done" style="height:${(done/maxV*100).toFixed(1)}%" title="เสร็จสิ้น ${done}"></div>
            <div class="annual-bar rest" style="height:${(rest/maxV*100).toFixed(1)}%" title="อื่นๆ ${rest}"></div>
          </div>
          <div class="annual-lbl">${monthLabel(k).split(" ")[0].slice(0,3)}</div>
        </div>`;
      }).join("")}
    </div>
    <div style="display:flex;gap:1.5rem;justify-content:center;margin:.5rem 0 2rem;font-size:.78rem;color:var(--muted)">
      <span><span style="display:inline-block;width:12px;height:12px;background:var(--green);border-radius:2px;margin-right:5px"></span>เสร็จสิ้น</span>
      <span><span style="display:inline-block;width:12px;height:12px;background:var(--accent);border-radius:2px;margin-right:5px"></span>รอ/ยกเลิก</span>
    </div>
    <hr class="divider"/>
    <div class="section-label">สรุปแต่ละเดือน</div>
    <div class="fin-list">
      ${allMonths.map(k=>{
        const list=byMonth(k);
        const done=list.filter(m=>statusOf(m)==="done").length;
        const upcoming=list.filter(m=>statusOf(m)==="upcoming").length;
        const cancel=list.filter(m=>statusOf(m)==="cancel").length;
        return `<div class="fin-item" style="border-left-color:var(--blue);cursor:pointer" onclick="(function(){viewMonth='${k}';renderAll();switchTab('overview');})()">
          <span class="nm">${monthLabel(k)}</span>
          <span class="dt">เสร็จ ${done} &middot; รอ ${upcoming} &middot; ยกเลิก ${cancel}</span>
          <span class="badge done">${list.length} รายการ</span>
        </div>`;
      }).join("")}
    </div>
  `;
}

function renderAll(){
  MKEYS=monthsAvailable();
  document.getElementById("month-label").textContent=monthLabel(viewMonth);
  renderOverview();
  renderList();
  renderDept();
  renderTrend();
}

/* ── clock ── */
const updateDate=()=>{document.getElementById("live-date").textContent=new Date().toLocaleDateString("th-TH",{weekday:"long",year:"numeric",month:"long",day:"numeric"});};
updateDate();setInterval(updateDate,60000);

/* ── theme ── */
let themeMode=localStorage.getItem("themeModeMeetings")||"auto";
function isNightUTC7(){
  const n=new Date();
  const u7=new Date(n.getTime()+(-7*60-n.getTimezoneOffset())*60000);
  return u7.getHours()>=19||u7.getHours()<6;
}
function effectiveTheme(){
  if(themeMode==="light")return"light";
  if(themeMode==="dark")return"dark";
  return isNightUTC7()?"dark":"light";
}
function applyTheme(){
  const t=effectiveTheme();
  document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light");
  const btn=document.getElementById("theme-toggle");
  if(btn){
    btn.textContent=themeMode==="auto"?"\u{1F317}":themeMode==="dark"?"\u{1F319}":"\u2600\uFE0F";
    btn.title=themeMode==="auto"?`อัตโนมัติ (ตอนนี้: ${t==="dark"?"กลางคืน":"กลางวัน"})`:themeMode==="dark"?"โหมดกลางคืน":"โหมดกลางวัน";
  }
}
window.cycleTheme=function(){
  themeMode=themeMode==="auto"?"light":themeMode==="light"?"dark":"auto";
  localStorage.setItem("themeModeMeetings",themeMode);
  applyTheme();
};
applyTheme();
setInterval(()=>{if(themeMode==="auto")applyTheme();},300000);

async function initApp(){
  document.getElementById("tab-overview").innerHTML='<div class="empty"><span>&#8987;</span>กำลังโหลดข้อมูล...</div>';
  const probe=await db.collection("meetings").limit(1).get();
  if(probe.empty){
    const batch=db.batch();
    SEED_MEETINGS.forEach(m=>batch.set(db.collection("meetings").doc(),m));
    await batch.commit();
  }
  db.collection("meetings").onSnapshot(snap=>{
    MEETINGS=snap.docs.map(d=>({...d.data(),_id:d.id}));
    MEETINGS.sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999")||(a.time||"").localeCompare(b.time||""));
    if(!viewMonth){const av=monthsAvailable();viewMonth=av.includes("2026-06")?"2026-06":av[av.length-1]||"2026-06";}
    ORG_COLOR=buildOrgColorMap();
    MKEYS=monthsAvailable();
    document.getElementById("info-count").textContent=MEETINGS.length;
    renderAll();
  });
}
initApp();

</script>
